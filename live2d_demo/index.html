<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>心晴助手 · Live2D</title>
    <link rel="stylesheet" href="/live2d_demo/styles.css" />
  </head>
  <body>
    <main id="app" class="app-shell">
      <section id="login-view" class="login-view">
        <div class="login-copy">
          <p class="eyebrow">XINQING / LIVE2D</p>
          <h1>让每一次倾诉<br /><span>都有回应。</span></h1>
          <p class="intro">使用昵称和密码登录心晴空间。真实姓名与紧急联系人仅用于必要的安全介入，不会显示在聊天界面。</p>
        </div>
        <form id="login-form" class="login-form">
          <div class="auth-tabs"><button id="login-tab" type="button" class="auth-tab active">登录</button><button id="register-tab" type="button" class="auth-tab">注册</button></div>
          <label for="nickname">昵称</label>
          <input id="nickname" name="nickname" autocomplete="username" placeholder="3-40 位昵称" required maxlength="40" />
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="至少 8 位" required minlength="8" />
          <div id="register-fields" class="is-hidden">
            <label for="real-name">真实姓名</label><input id="real-name" name="real_name" autocomplete="name" placeholder="仅用于安全介入" maxlength="80" />
            <label for="contact-name">紧急联系人姓名</label><input id="contact-name" name="contact_name" placeholder="至少一位联系人" maxlength="80" />
            <label for="contact-phone">紧急联系人电话</label><input id="contact-phone" name="contact_phone" type="tel" placeholder="联系人电话" maxlength="40" />
            <label for="contact-email">紧急联系人邮箱</label><input id="contact-email" name="contact_email" type="email" placeholder="高风险预警通知邮箱" maxlength="160" required />
          </div>
          <button id="auth-submit" class="primary-button" type="submit">登录并进入 <span aria-hidden="true">→</span></button>
          <button id="auth-switch" class="muted auth-switch" type="button">还没有账户？点击“注册”</button>
          <p id="login-error" class="form-error" role="alert"></p>
        </form>
      </section>

      <section id="chat-view" class="chat-view is-hidden">
        <header class="topbar">
          <div class="brand"><span class="brand-mark">心</span><span>心晴助手</span></div>
          <div class="session-meta">
            <span id="user-label"></span>
            <button id="portrait-toggle" class="icon-button mode-button" type="button" title="切换竖屏模式" aria-label="切换竖屏模式">▯</button>
            <button id="logout-button" class="text-button" type="button">退出</button>
          </div>
        </header>
        <div class="workspace">
          <section class="avatar-panel">
            <div class="avatar-header">
              <div><p class="eyebrow">LIVE2D COMPANION</p><h2>陪你聊一会儿</h2></div>
              <span id="model-status" class="status-dot">连接中</span>
            </div>
            <div id="avatar-stage" class="avatar-stage">
              <canvas id="avatar-canvas"></canvas>
              <div id="avatar-reply" class="avatar-reply" aria-live="polite"></div>
            </div>
            <div class="avatar-footer"><span id="avatar-command">准备就绪</span><span>Hiyori Free</span></div>
          </section>
          <section class="conversation-panel">
            <div class="conversation-header">
              <div><p class="eyebrow">CONVERSATION</p><h2 id="conversation-title">新的对话</h2></div>
              <button id="new-conversation" class="icon-button" type="button" title="新建会话" aria-label="新建会话">＋</button>
            </div>
            <div id="message-list" class="message-list" aria-live="polite"></div>
            <button id="history-button" class="history-button" type="button" title="查看历史对话">‹ 查看历史对话</button>
            <form id="composer" class="composer">
              <textarea id="message-input" rows="1" placeholder="把此刻的感受告诉我…" maxlength="4000"></textarea>
              <button id="send-button" class="send-button" type="submit" title="发送" aria-label="发送">↑</button>
            </form>
            <p id="chat-error" class="form-error" role="alert"></p>
          </section>
        </div>
      </section>
    </main>
    <aside id="assessment-modal" class="assessment-modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="assessment-title">
      <div class="assessment-card">
        <button id="assessment-close" class="assessment-close" type="button" aria-label="关闭状态评估">×</button>
        <p class="eyebrow">WELLBEING CHECK-IN</p>
        <h2 id="assessment-title">状态评估</h2>
        <p class="assessment-disclaimer">这是基于当前对话的初步整理，不是医学诊断。</p>
        <div id="assessment-metrics" class="assessment-metrics"></div>
        <p id="assessment-summary" class="assessment-summary"></p>
      </div>
    </aside>
    <script type="module" src="/live2d_demo/app.js"></script>
  </body>
</html>
