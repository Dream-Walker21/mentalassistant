[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xinqing"]

[project]
name = "xinqing-assistant"
version = "0.1.0"
description = "心晴助手 — LangGraph 心理支持工作流"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-cli[inmem]>=0.1.0",
    "langchain-core>=0.3.0",
    "langchain-deepseek>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.1.0",
    "chromadb>=0.5.0",
    "pypdf>=5.0.0",
    "flask>=3.0.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.64.0",
    "typing-extensions>=4.9.0",
    "structlog>=25.0.0",
]

[project.optional-dependencies]
local-embedding = [
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
    "modelscope>=1.30.0",
]
api-embedding = ["langchain-openai>=0.3.0"]
ollama = ["langchain-ollama"]
qdrant = ["qdrant-client", "langchain-qdrant"]
fastapi = ["fastapi", "uvicorn"]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pre-commit>=3.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["xinqing"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
